name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Editable install of this repo fails (flat-layout / no package).
      # The [dev] extra in pyproject.toml is pytest>=8.
      - name: Install test dependencies
        run: python -m pip install "pytest>=8"

      - name: Run pytest
        run: python -m pytest
