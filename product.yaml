faq:
  - q: What do I get?
    a: Screenshots of Claude, Cursor, Desktop, and Grok connected to your server, within two business days. We do not change your code.
  - q: How long does it take?
    a: Two business days after payment, if the free checker passes on the URL you paste at checkout.
  - q: What if the checker fails?
    a: We tell you which check failed and quote a separate fix. The $149 report is for servers that already pass.
  - q: Do you change my server?
    a: No. We sign in from our accounts and send screenshots. Server changes, identity-provider setup, and hosting are not included.
  - q: How do I pay?
    a: On this site, through Stripe. Installing the checker from GitHub is free. This is not billed through Cursor.
