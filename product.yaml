faq:
  - q: What do I get for $149?
    a: An attach trace — we attempt Claude, Cursor, Desktop, and Grok against your server and write which step worked or died in each client, with real responses. Screenshots are evidence, not the product.
  - q: Why not just run the free checker?
    a: diagnose.py reads metadata. It never hits registration, never exchanges a code, never calls tools/list. Four real clients do things metadata cannot predict — that is what you are buying.
  - q: What if my server already fails the checker?
    a: Buy the trace. Failures and unknowns are the intended buyers. The checker is a scoping step, not a gate that blocks payment.
  - q: What is a fix round?
    a: After the trace, we quote a separate fix (typically $600–$1,500). We change what is needed so Connectors attach; you review and merge. Not included in $149.
  - q: Do you change my server in the $149 round?
    a: No. The trace round is read-only against your origin from our accounts. Code changes are the fix round.
  - q: What if you cannot tell me why it failed?
    a: You get your money back. That is on the page, not a private note.
  - q: How do I pay?
    a: On this site, through Stripe. Installing the checker from GitHub is free. This is not billed through Cursor.
